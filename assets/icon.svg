<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="clipBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="40%" stop-color="#eceff1"/>
      <stop offset="70%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Paperclip wire -->
  <g filter="url(#dropShadow)" fill="none" stroke="url(#clipBody)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 17 38 L 17 14 C 17 9, 23 5, 29 8 C 34 11, 34 16, 34 22 L 34 37 C 34 42, 27 45, 21 42 C 14 39, 10 32, 10 24 L 10 13 C 10 6, 17 2, 25 2 C 34 2, 40 8, 40 17 L 40 37" />
  </g>

  <!-- Inner wire darker contour highlight -->
  <path d="M 17 38 L 17 14 C 17 9, 23 5, 29 8 C 34 11, 34 16, 34 22 L 34 37 C 34 42, 27 45, 21 42 C 14 39, 10 32, 10 24 L 10 13 C 10 6, 17 2, 25 2 C 34 2, 40 8, 40 17 L 40 37" 
        fill="none" stroke="#263238" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />

  <!-- Eyebrows -->
  <path d="M 13 14 Q 18 10 23 14" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 28 13 Q 33 8 38 12" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Eye -->
  <ellipse cx="18" cy="20" rx="4.8" ry="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
  <ellipse cx="19" cy="20.5" rx="2.5" ry="3.2" fill="#0f172a" />
  <circle cx="17.8" cy="18.5" r="1.1" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="33" cy="19" rx="4.8" ry="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
  <ellipse cx="34" cy="19.5" rx="2.5" ry="3.2" fill="#0f172a" />
  <circle cx="32.8" cy="17.5" r="1.1" fill="#ffffff" />
</svg>
